project:
  type: book
  output-dir: docs/new   # new edition at /pchem1/new/; docs/ itself keeps the previous (bookdown) edition
  render:
    - "*.qmd"
  post-render: scripts/sidebar_sections.py
  resources:
    - .nojekyll   # GitHub Pages: serve site_libs/ as is
    - img/logo-light.png
    - img/logo-dark.png

lang: en
language:
  crossref-ch-prefix: Chapter
  crossref-sec-prefix: Sec.

book:
  title: "The Live Textbook of Physical Chemistry 1"
  output-file: pchem1
  author: "Roberto Peverati"
  description: "Volume 1 — Which Way and How Fast: Thermodynamics, Equilibria, Solutions, and Chemical Kinetics"   # volume title, same as the PDF
  date: today
  date-format: "D MMMM YYYY"
  repo-url: https://github.com/peverati/pchem1
  repo-branch: master
  repo-actions: [edit, issue]
  downloads: [pdf]
  search:
    location: sidebar
    type: textbox
  navbar:
    logo:
      light:
        path: img/logo-light.png
        alt: "Peverati research group logo"
      dark:
        path: img/logo-dark.png
        alt: "Peverati research group logo"
    logo-href: https://peverati.github.io
    title: false
    left:
      - text: "The Live Textbook of Physical Chemistry 1"
        href: index.qmd
  page-footer:
    center: "Text and figures: [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/), except third-party images as credited · Scripts: [MIT](https://github.com/peverati/pchem1/blob/master/scripts/LICENSE)"
  chapters:
    - index.qmd
    - part: "The Laws of Thermodynamics"
      chapters:
        - 01_Basis.qmd
        - 02_ZerothLaw.qmd
        - 03_FirstLaw.qmd
        - 04_ThermodynamicCycles.qmd
        - 05_SecondLaw.qmd
        - 06_ThirdLaw.qmd
    - part: "Chemical Thermodynamics"
      chapters:
        - 07_Thermochemistry.qmd
        - 08_Potentials.qmd
        - 09_Gibbs.qmd
        - 10_ChemicalEquilibrium.qmd
    - part: "Phase Equilibria and Solutions"
      chapters:
        - 11_NonIdealGases.qmd
        - 12_PhaseEquilibrium.qmd
        - 13_MCPhaseDiagrams.qmd
    - part: "Chemical Kinetics"
      chapters:
        - 14_Kinetics.qmd
  appendices:
    - A1_Appendix.qmd
    - A2_References.qmd

bibliography: book.bib
citation-location: document

filters:
  - path: pdf-fixes.lua      # "Eq. (5.7)" in the PDF; no empty line after each answer choice
    at: post-render

crossref:
  eq-prefix: Eq.
  fig-prefix: Fig.
  tbl-prefix: Table
  sec-prefix: Sec.
  def-prefix: Definition
  exm-prefix: Example

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: quarto.css
    html-math-method: mathjax
    include-in-header:
      - mathjax-macros.html
      - punctuation.html
    include-after-body:
      - sidebar-toc.html
    number-depth: 3
    page-layout: full   # no right-hand column: the content uses the space
    fig-align: center
  pdf:
    subtitle: "Thermodynamics, Equilibria, Solutions, and Chemical Kinetics"   # print subtitle
    documentclass: scrbook
    pdf-engine: xelatex
    mainfont: STIXTwoText        # STIX Two, from fonts/ (static files, so bold and italic work); one family for text, headings, and math
    mainfontoptions: [Path=./fonts/, Extension=.otf, UprightFont=*-Regular, ItalicFont=*-Italic, BoldFont=*-Bold, BoldItalicFont=*-BoldItalic]
    mathfont: STIXTwoMath-Regular.otf
    mathfontoptions: [Path=./fonts/]
    indent: true                 # indented paragraphs, as in printed books (no blank line between paragraphs)
    toc-title: Contents
    colorlinks: true             # clickable links shown in dark blue (cross-references, URLs, citations)
    linkcolor: "blue!55!black"
    urlcolor: "blue!55!black"
    citecolor: "blue!55!black"
    filecolor: "blue!55!black"
    classoption: [oneside]
    geometry:
      - paperwidth=6in
      - paperheight=9in
      - margin=0.75in
    fontsize: 10pt
    include-in-header:
      - file: pdf-style.tex     # headings, captions, running heads, boxes
      - text: |
          \usepackage{cancel}
          \usepackage{booktabs}
          \usepackage{pdfpages}
          \usepackage[version=4]{mhchem}
          \newcommand*{\standardstate}{{-\kern-6pt{\ominus}\kern-6pt-}}
          \subject{The Live Textbook of Physical Chemistry, Volume 1}
          \AtBeginDocument{\title{Which Way and How Fast}}  % print title (the website keeps the series name)
          \AtBeginDocument{\subtitle{Thermodynamics, Equilibria, Solutions, and Chemical Kinetics}}  % the preface's own subtitle would otherwise replace it
          \AtBeginDocument{\includepdf[pages={1}]{FrontPage_6x9.pdf}}  % cover
          \DeclareOldFontCommand{\bf}{\normalfont\bfseries}{\mathbf}
          \DeclareOldFontCommand{\rm}{\normalfont\rmfamily}{\mathrm}
          \DeclareOldFontCommand{\it}{\normalfont\itshape}{\mathit}
          % definitions (def-) and worked examples (exm-): thin gray frames, like the other boxes (pdf-style.tex loads tcolorbox)
          \AtBeginDocument{\tcolorboxenvironment{definition}{breakable, enhanced, colback=white, colframe=black!35, boxrule=0.4pt, arc=0pt, left=2.5mm, right=2.5mm}}
          \AtBeginDocument{\tcolorboxenvironment{example}{breakable, enhanced, colback=white, colframe=black!65, boxrule=0.4pt, arc=0pt, left=2.5mm, right=2.5mm}}
    fig-pos: "htbp"
