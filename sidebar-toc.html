<!-- Left sidebar: an arrow next to each chapter expands its sections.
     The current chapter starts open; the others start closed.
     Section lists come from sidebar-sections.json (written by scripts/sidebar_sections.py). -->
<style>
#quarto-sidebar .sidebar-item-container { display: flex; align-items: flex-start; }
#quarto-sidebar .sidebar-item-container > a { flex: 1 1 auto; min-width: 0; }
.chapter-toggle { flex: none; border: 0; background: none; color: inherit; opacity: 0.6; padding: 0 0.25rem; margin-left: 0.2rem; line-height: 1.4; cursor: pointer; }
.chapter-toggle:hover, .chapter-toggle:focus-visible { opacity: 1; }
.chapter-toggle .bi { display: inline-block; transition: transform 0.15s; }
.chapter-toggle[aria-expanded="true"] .bi { transform: rotate(90deg); }
.sidebar-chapter-toc { list-style: none; padding-left: 1.1rem; margin: 0.15rem 0 0.4rem; font-size: 0.85em; }
.sidebar-chapter-toc[hidden] { display: none; }
.sidebar-chapter-toc ul { list-style: none; padding-left: 0.9rem; margin: 0; }
.sidebar-chapter-toc a { display: block; padding: 0.1rem 0; color: inherit; opacity: 0.8; text-decoration: none; }
.sidebar-chapter-toc a:hover { opacity: 1; text-decoration: underline; }
</style>
<script>
document.addEventListener("DOMContentLoaded", function () {
  fetch("sidebar-sections.json").then(function (r) { return r.json(); }).then(function (sections) {
    var here = location.pathname.split("/").pop() || "index.html";
    document.querySelectorAll("#quarto-sidebar .sidebar-item-container > a.sidebar-link").forEach(function (a, i) {
      var page = new URL(a.href, location.href).pathname.split("/").pop() || "index.html";
      if (!sections[page]) return;
      var li = a.closest("li");
      var holder = document.createElement("div");
      holder.innerHTML = sections[page];
      var list = holder.firstElementChild;
      list.className = "sidebar-chapter-toc";
      list.id = "sidebar-sections-" + i;
      var open = page === here;
      list.hidden = !open;
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "chapter-toggle";
      btn.setAttribute("aria-expanded", open ? "true" : "false");
      btn.setAttribute("aria-controls", list.id);
      btn.setAttribute("aria-label", "Show sections of " + a.textContent.trim().replace(/\s+/g, " "));
      btn.innerHTML = '<i class="bi bi-chevron-right" aria-hidden="true"></i>';
      btn.addEventListener("click", function () {
        var nowOpen = list.hidden;
        list.hidden = !nowOpen;
        btn.setAttribute("aria-expanded", nowOpen ? "true" : "false");
      });
      a.parentElement.appendChild(btn);
      li.appendChild(list);
    });
    // section titles with math (e.g., "Temperature Dependence of ΔG") need MathJax after insertion
    var lists = Array.prototype.slice.call(document.querySelectorAll(".sidebar-chapter-toc"));
    (function typeset(tries) {
      if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise(lists).catch(function () {});
      else if (tries > 0) setTimeout(function () { typeset(tries - 1); }, 300);
    })(20);
  }).catch(function () {});
});
</script>
<script>
// Wide screens keep the top bar visible (see quarto.css): measure its height for the sidebar offset.
(function () {
  function setHeight() {
    var h = document.querySelector("#quarto-header");
    if (h) document.documentElement.style.setProperty("--header-height", h.offsetHeight + "px");
  }
  setHeight();
  window.addEventListener("resize", setHeight);
})();
</script>
