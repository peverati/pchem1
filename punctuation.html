<script type="text/javascript">
// Keep punctuation that immediately follows inline math on the same line as the math
// (otherwise browsers may start a new line with a comma or a period).
(function () {
  function glue(root) {
    var spans = (root || document).querySelectorAll("span.math.inline:not([data-glued])");
    for (var i = 0; i < spans.length; i++) {
      var s = spans[i];
      s.setAttribute("data-glued", "1");
      var t = s.nextSibling;
      if (!t || t.nodeType !== 3) continue;
      var m = t.nodeValue.match(/^[,.;:!?)\]'’”]+/);
      if (!m) continue;
      var rest = t.splitText(m[0].length);
      var wrap = document.createElement("span");
      wrap.style.whiteSpace = "nowrap";
      s.parentNode.insertBefore(wrap, s);
      wrap.appendChild(s);
      wrap.appendChild(t);
    }
  }
  if (window.MathJax && MathJax.Hub) {
    MathJax.Hub.Register.MessageHook("Begin Process", function () { glue(document); });
  }
  document.addEventListener("DOMContentLoaded", function () { glue(document); });
})();
</script>
